<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wubby's Treat Run</title>
    <meta name="description" content="Wubby's Treat Run: a short pixel platformer. A sneaky squirrel stole Wubby's treat! Chase it through three levels and get it back.">
    <meta name="theme-color" content="#71d2e0">
    <!-- Link previews. Scrapers want absolute URLs: prefix the image path with your site URL once it's live. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Wubby's Treat Run">
    <meta property="og:title" content="Wubby's Treat Run">
    <meta property="og:description" content="A sneaky squirrel stole Wubby's treat! Chase it through three levels and get it back.">
    <meta property="og:image" content="public/assets/game/og_image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Wubby's Treat Run logo over a pixel-art garden with Wubby chasing the squirrel thief">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wubby's Treat Run">
    <meta name="twitter:description" content="A sneaky squirrel stole Wubby's treat! Chase it through three levels and get it back.">
    <meta name="twitter:image" content="public/assets/game/og_image.png">
    <link rel="stylesheet" href="public/assets/game/ui.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->
    <div id="hud" class="hud hidden">
        <div class="hud-row">
            <div class="hud-left">
                <div class="ui-panelS hud-panel" id="hearts" aria-label="Hearts"></div>
                <div class="ui-panelS hud-panel" title="Bones collected in this level"><span class="ui-icon-bone" role="img" aria-label="Bones"></span><span id="bones" class="hud-text">0/0</span></div>
                <div class="ui-panelS hud-panel" title="Golden bones"><span class="ui-icon-golden" role="img" aria-label="Golden bones"></span><span id="goldens" class="hud-text">0/9</span></div>
            </div>
            <!-- Journey progress across all levels -->
            <div class="journey" aria-label="Journey progress">
                <div class="journey-bar">
                    <div class="ui-bar-track journey-track">
                        <div class="journey-inner" id="journeyInner">
                            <div class="ui-bar-fill journey-fill hidden" id="journeyFill"></div>
                            <span class="ui-bar-wubby journey-wubby" id="journeyWubby"></span>
                        </div>
                    </div>
                    <div class="journey-labels" id="journeyLabels"></div>
                </div>
                <span class="journey-thief ui-bar-thief" id="journeyThief" title="The thief"></span>
            </div>
            <div class="hud-buttons">
                <button id="muteBtn" class="icon-btn ui-btn-sound-on" aria-label="Toggle sound"></button>
                <button id="pauseBtn" class="icon-btn ui-btn-pause" aria-label="Pause"></button>
            </div>
        </div>
    </div>

    <!-- Controls hint at the start of level 1; fades once Wubby has moved and jumped -->
    <div id="controlsHint" class="controls-hint" aria-hidden="true">
        <span class="hint-keys"><b>◀ ▶</b> move</span><span class="hint-dot">·</span><span class="hint-keys"><b class="kbd-only">SPACE</b><b class="touch-only">JUMP</b> jump</span><span class="hint-dot">·</span><span>hold for higher</span>
    </div>

    <!-- Level start banner (fades in and out; gameplay keeps running) -->
    <div id="levelBanner" class="level-banner" aria-live="polite"><div class="ui-banner banner-ribbon"><span id="levelBannerText"></span></div></div>

    <!-- Title: logo, then the story line, then Play; everything else stays quiet -->
    <div id="titleScreen" class="screen title-screen hidden">
        <div class="title-stack">
            <img class="logo" src="public/assets/game/logo.png" alt="Wubby's Treat Run">
            <p class="story">A sneaky squirrel stole Wubby's treat! Chase it through 3 levels and get it back.</p>
            <button id="playBtn" class="ui-btn-primary btn btn-primary play-btn">PLAY</button>
            <p id="levelError" class="error hidden"></p>
        </div>
        <p id="titleLove" class="title-love hidden" aria-live="polite"></p>
    </div>

    <!-- Pause -->
    <div id="pauseScreen" class="screen hidden">
        <div class="ui-panelL-box panel">
            <h2 class="heading">Paused</h2>
            <button id="resumeBtn" class="ui-btn-primary btn btn-primary">RESUME</button>
            <button id="restartLevelBtn" class="ui-btn-wide btn">Restart level</button>
            <button id="quitBtn" class="ui-btn-wide btn">Quit to title</button>
            <div class="pause-keys">
                <span class="keys"><span class="ui-key key">Esc</span> resume</span>
                <span class="keys"><span class="ui-key key">M</span> sound</span>
            </div>
        </div>
    </div>

    <!-- Reward card (shown right after the end scene) -->
    <div id="cardScreen" class="screen card-screen hidden">
        <div class="end-stack">
            <!-- Hero: the polaroid itself (this canvas is the shared/downloaded image) -->
            <div class="polaroid-drop"><canvas id="cardCanvas" class="card-canvas" width="1080" height="1350" aria-label="Your reward polaroid"></canvas></div>
            <label class="name-row">
                <span class="label-text">Your name on the photo</span>
                <span class="ui-input name-field"><input id="nameInput" type="text" maxlength="20" autocomplete="off" spellcheck="false" placeholder="a kind stranger"></span>
            </label>
            <div class="card-actions">
                <button id="copyImageBtn" class="ui-btn-primary btn btn-primary">Copy image</button>
                <button id="playAgainBtn" class="ui-btn-wide btn">Play again</button>
            </div>
            <p id="cardStatus" class="card-status" aria-live="polite"></p>
            <!-- Send Wubby some love: one per browser; reveals the creator block -->
            <div class="love">
                <button id="loveBtn" class="love-btn" type="button"><span class="love-heart" aria-hidden="true">♥</span><span id="loveLabel">Send Wubby some love</span></button>
                <p id="loveThanks" class="love-thanks" aria-live="polite"></p>
            </div>
            <section id="creatorBlock" class="creator hidden" aria-label="About the creator">
                <p class="creator-name">Designed and built by <span data-creator="name"></span></p>
                <p class="creator-tagline" data-creator="tagline"></p>
                <div class="creator-links">
                    <a id="creatorLinkedIn" class="creator-cta" data-cta="linkedin" target="_blank" rel="noopener">Say hi on LinkedIn →</a>
                    <a id="creatorPortfolio" class="creator-link" data-cta="portfolio" target="_blank" rel="noopener">View portfolio</a>
                </div>
            </section>
            <p class="end-footer">Made by <span data-creator="name"></span><span id="footerLinkedInWrap"> · <a id="footerLinkedIn" data-cta="linkedin" target="_blank" rel="noopener">LinkedIn</a></span></p>
        </div>
    </div>

    <!-- Touch controls (touch devices, in levels only) -->
    <div class="touch-controls">
        <div class="touch-group">
            <button class="ui-key touch-btn" data-control="left" aria-label="Move left">◀</button>
            <button class="ui-key touch-btn" data-control="right" aria-label="Move right">▶</button>
        </div>
        <button class="ui-key-space touch-btn jump" data-control="jump" aria-label="Jump">JUMP</button>
    </div>

    <script src="config.js"></script>
    <script src="analytics.js"></script>
    <script src="engine.js"></script>
    <script src="public/assets/game/manifest.js"></script>
    <script src="art.js"></script>
    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="levels/level3.js"></script>
    <script src="rewardCard.js"></script>
    <script src="share.js"></script>
    <script src="game.js"></script>
    <script src="love.js"></script>
</body>

</html>
